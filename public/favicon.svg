<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="shivGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Dark OS Card Background -->
  <rect width="512" height="512" rx="112" fill="#020617"/>
  <circle cx="256" cy="256" r="210" fill="url(#shivGlow)"/>

  <!-- TRIPUND (Three Sacred Vibhuti Lines - Mahakal Style) -->
  <g filter="drop-shadow(0 0 12px rgba(248,250,252,0.5))">
    <!-- Top Line -->
    <path d="M 116 176 Q 256 150 396 176" fill="none" stroke="#f8fafc" stroke-width="34" stroke-linecap="round"/>
    <!-- Middle Line -->
    <path d="M 96 256 Q 256 230 416 256" fill="none" stroke="#f8fafc" stroke-width="34" stroke-linecap="round"/>
    <!-- Bottom Line -->
    <path d="M 116 336 Q 256 310 396 336" fill="none" stroke="#f8fafc" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- Central Red Kumkum Bindu -->
  <circle cx="256" cy="256" r="26" fill="#ef4444" filter="drop-shadow(0 0 10px rgba(239,68,68,0.9))"/>
  <circle cx="249" cy="249" r="6" fill="#fca5a5"/>
</svg>
