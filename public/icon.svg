<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="jagannathGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Card Frame Background -->
  <rect width="512" height="512" rx="112" fill="#020617"/>
  <circle cx="256" cy="256" r="220" fill="url(#jagannathGlow)"/>

  <!-- Outer Aura Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ea580c" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="12 8"/>

  <!-- Black Face Base -->
  <path d="M 140 160 C 140 110, 372 110, 372 160 L 372 360 C 372 395, 140 395, 140 360 Z" fill="#0a0a0c" stroke="#27272a" stroke-width="4"/>

  <!-- Crown / Top Motif (Chula) -->
  <path d="M 216 115 C 216 75, 296 75, 296 115 Z" fill="url(#crownGrad)"/>
  <circle cx="256" cy="72" r="12" fill="#dc2626"/>

  <!-- Forehead Tilak (Chita) -->
  <path d="M 232 135 Q 256 122 280 135 L 272 190 Q 256 205 240 190 Z" fill="#ffffff"/>
  <circle cx="256" cy="155" r="10" fill="#dc2626"/>
  <line x1="256" y1="165" x2="256" y2="192" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>

  <!-- LEFT EYE -->
  <g id="left-eye">
    <circle cx="192" cy="245" r="52" fill="#dc2626"/>
    <circle cx="192" cy="245" r="45" fill="#fbbf24"/>
    <circle cx="192" cy="245" r="38" fill="#ffffff"/>
    <circle cx="192" cy="245" r="22" fill="#000000"/>
    <circle cx="185" cy="238" r="6" fill="#ffffff"/>
  </g>

  <!-- RIGHT EYE -->
  <g id="right-eye">
    <circle cx="320" cy="245" r="52" fill="#dc2626"/>
    <circle cx="320" cy="245" r="45" fill="#fbbf24"/>
    <circle cx="320" cy="245" r="38" fill="#ffffff"/>
    <circle cx="320" cy="245" r="22" fill="#000000"/>
    <circle cx="313" cy="238" r="6" fill="#ffffff"/>
  </g>

  <!-- Nose Line -->
  <line x1="256" y1="215" x2="256" y2="280" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="285" r="7" fill="#dc2626"/>

  <!-- Iconic Smile -->
  <path d="M 175 318 Q 256 375 337 318 Q 256 345 175 318 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>

  <!-- Traditional Cheek Dots -->
  <circle cx="140" cy="290" r="8" fill="#dc2626"/>
  <circle cx="372" cy="290" r="8" fill="#dc2626"/>
</svg>
